name: tests

on:
  # Only main on push. A branch with an open pull request would otherwise
  # run everything twice for each commit -- once for the push and once for
  # the pull_request -- which the first run on this workflow did.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Superseded runs are not worth finishing: a second commit while the first
  # is still building makes the first answer stale.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    # The synthetic checks each detector carries. No video, no model
    # weights, no torch: a ball walked over each edge of the pitch, a
    # restart from each landmark, a possession timeline that is right,
    # backwards, or a coin flip. Seconds to run, so it gates every push.
    name: controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the light dependencies
        # Deliberately not requirements.txt: that pulls ultralytics and
        # torch, which these checks do not need and which would turn a
        # seven-second job into a five-minute one.
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "pandas>=2.1" "pyarrow>=15.0" \
                      "scipy>=1.11" "opencv-python-headless>=4.9.0" \
                      "scikit-learn>=1.4"
      - run: python run_tests.py --controls

  pipeline:
    # main.py end to end on a synthetic match. Slower, because main.py
    # imports the detector stack even with --skip-detect, so this needs
    # torch. It is the only thing that catches a change breaking the report.
    name: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch first
        # Without this, ultralytics pulls the CUDA build: gigabytes of
        # download for a runner with no GPU.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Install the rest
        run: |
          pip install -r requirements.txt
          pip install opencv-python-headless
      - run: python test_main_pipeline.py
